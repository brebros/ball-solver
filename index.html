<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Ball Solver — multi-rail kick/bank</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 10px 10px 40px; }
  h1 { font-size: 17px; margin: 4px 0 2px; display: flex; align-items: center; gap: 8px; }
  h1 small { font-weight: 400; color: #8b949e; font-size: 12px; }
  #stbadge { font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb66; }
  .bar { display: flex; gap: 8px; margin: 10px 0 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: flex; border: 1px solid #30363d; border-radius: 9px; overflow: hidden; }
  .seg button { background: #161b22; color: #8b949e; border: 0; padding: 9px 16px;
    font-size: 14px; font-weight: 600; min-height: 40px; }
  .seg button.on { background: #1f6feb; color: #fff; }
  .step { display: flex; align-items: center; border: 1px solid #30363d; border-radius: 9px; overflow: hidden; }
  .step button { background: #161b22; color: #e6edf3; border: 0; width: 40px; min-height: 40px; font-size: 17px; }
  .step span { padding: 0 10px; font-size: 13px; color: #8b949e; min-width: 64px; text-align: center; }
  .ghostbtn { background: #161b22; border: 1px solid #30363d; color: #8b949e;
    border-radius: 9px; padding: 9px 14px; min-height: 40px; font-size: 13px; }
  #tablebox { position: relative; }
  canvas { width: 100%; display: block; border-radius: 10px; touch-action: none; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #8b949e; margin: 8px 2px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #status { font-size: 13px; color: #8b949e; margin: 6px 2px; min-height: 18px; }
  #list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .sol { display: flex; align-items: center; gap: 10px; background: #161b22;
    border: 1px solid #30363d; border-radius: 9px; padding: 9px 12px; min-height: 46px;
    color: inherit; font: inherit; text-align: left; }
  .sol.sel { border-color: #1f6feb; background: #1f6feb1a; }
  .tag { font-weight: 700; font-size: 12px; color: #58a6ff; min-width: 74px;
    font-family: ui-monospace, Menlo, monospace; }
  .metrics { font-size: 12px; color: #8b949e; font-family: ui-monospace, Menlo, monospace; }
  .metrics b { color: #e6edf3; font-weight: 600; }
  .rank { margin-left: auto; font-size: 11px; color: #484f58; }
  .empty { color: #484f58; font-size: 13px; padding: 10px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ball Solver <small>multi-rail kick / bank</small> <span id="stbadge">…</span></h1>
  <div class="bar">
    <div class="seg">
      <button id="mKick" class="on">KICK</button>
      <button id="mBank">BANK</button>
    </div>
    <div class="step">
      <button id="rMinus">−</button><span id="rLabel">rails ≤ 3</span><button id="rPlus">+</button>
    </div>
    <button class="ghostbtn" id="btnReset">reset</button>
  </div>
  <div id="tablebox"><canvas id="cv"></canvas></div>
  <div class="legend">
    <span><i class="dot" style="background:#f2f2f2"></i>cue (C)</span>
    <span><i class="dot" style="background:#ffb02e"></i>object (O)</span>
    <span><i class="dot" style="background:#3fb950"></i>pocket (P)</span>
    <span>drag balls · tap a solution</span>
  </div>
  <div id="status"></div>
  <div id="list"></div>
</div>
<script>
//=== CORE BEGIN ===
// Faithful port of ball_solver_agent.py (mirror/unfold geometry, stdlib-free).
var RAILS = ['L', 'R', 'B', 'T'];
var BALL_R = 0.0286;

function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
function mul(a, s) { return [a[0] * s, a[1] * s]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
function dist(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }
function norm(v) {
  var d = Math.hypot(v[0], v[1]);
  return d ? [v[0] / d, v[1] / d] : [0, 0];
}
function ang(a, b) {
  var n = norm(a), m = norm(b), c = dot(n, m);
  return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
}
function aimDeg(v) { return (Math.atan2(v[1], v[0]) * 180 / Math.PI + 360) % 360; }

function reflect(p, rail, W, H) {
  var x = p[0], y = p[1];
  if (rail === 'L') return [-x, y];
  if (rail === 'R') return [2 * W - x, y];
  if (rail === 'B') return [x, -y];
  return [x, 2 * H - y];
}
function railGeom(rail, W, H) {
  if (rail === 'L') return ['v', 0];
  if (rail === 'R') return ['v', W];
  if (rail === 'B') return ['h', 0];
  return ['h', H];
}
function cross(p0, p1, rail, W, H) {
  var g = railGeom(rail, W, H), kind = g[0], c = g[1];
  var x0 = p0[0], y0 = p0[1], x1 = p1[0], y1 = p1[1];
  if (kind === 'v') {
    if (x1 === x0) return [null, null];
    var t = (c - x0) / (x1 - x0);
    return [[c, y0 + t * (y1 - y0)], t];
  }
  if (y1 === y0) return [null, null];
  var t2 = (c - y0) / (y1 - y0);
  return [[x0 + t2 * (x1 - x0), c], t2];
}
function onRail(p, rail, W, H, eps) {
  eps = eps || 1e-6;
  var kind = railGeom(rail, W, H)[0];
  return kind === 'v'
    ? (-eps <= p[1] && p[1] <= H + eps)
    : (-eps <= p[0] && p[0] <= W + eps);
}
function build(S, T, rails, W, H) {
  var end = T.slice();
  for (var i = rails.length - 1; i >= 0; i--) end = reflect(end, rails[i], W, H);
  var start = S.slice(), pts = [S.slice()], length = 0;
  for (var j = 0; j < rails.length; j++) {
    var r = rails[j];
    var cr = cross(start, end, r, W, H), B = cr[0], t = cr[1];
    if (B === null || t < 0 || t > 1 || !onRail(B, r, W, H)) return null;
    pts.push(B);
    length += dist(start, B);
    end = reflect(end, r, W, H);
    start = B;
  }
  pts.push(T);
  length += dist(start, T);
  return [pts, length];
}
function verify(pts, rails, W, H, tol) {
  tol = tol || 1e-3;
  for (var i = 0; i < rails.length; i++) {
    var A = pts[i], Bp = pts[i + 1], C = pts[i + 2];
    var inc = norm(sub(Bp, A)), out = norm(sub(C, Bp));
    var kind = railGeom(rails[i], W, H)[0];
    if (kind === 'v') {
      if (Math.abs(out[0] + inc[0]) > tol || Math.abs(out[1] - inc[1]) > tol) return false;
    } else {
      if (Math.abs(out[1] + inc[1]) > tol || Math.abs(out[0] - inc[0]) > tol) return false;
    }
  }
  return true;
}
function solveRaw(S, T, W, H, maxRails) {
  var out = [];
  for (var n = 0; n <= maxRails; n++) {
    var stacks = [[]];
    for (var i = 0; i < n; i++) {
      var next = [];
      for (var s = 0; s < stacks.length; s++)
        for (var k = 0; k < RAILS.length; k++) next.push(stacks[s].concat([RAILS[k]]));
      stacks = next;
    }
    for (var si = 0; si < stacks.length; si++) {
      var rails = stacks[si], skip = false;
      for (var a = 0; a < rails.length - 1; a++) if (rails[a] === rails[a + 1]) { skip = true; break; }
      if (skip) continue;
      var res = build(S, T, rails, W, H);
      if (!res) continue;
      if (!verify(res[0], rails, W, H)) continue;
      out.push({ rails: rails, pts: res[0], len: res[1] });
    }
  }
  return out;
}
function solveKick(C, O, P, W, H, maxRails) {
  var dObj = norm(sub(P, O));
  var ghost = sub(O, mul(dObj, 2 * BALL_R));
  var raw = solveRaw(C, ghost, W, H, maxRails), res = [];
  for (var i = 0; i < raw.length; i++) {
    var c = raw[i], pts = c.pts;
    var dCue = pts.length >= 2 ? norm(sub(pts[pts.length - 1], pts[pts.length - 2])) : norm(sub(ghost, C));
    var cut = ang(dCue, dObj);
    if (cut >= 85) continue;
    res.push({
      rails: c.rails, pts: pts,
      len: +c.len.toFixed(4), cut: +cut.toFixed(2), aim: +aimDeg(dCue).toFixed(2),
      score: +(c.rails.length * 100 + c.len * 10 + cut * 2).toFixed(2)
    });
  }
  res.sort(function (x, y) { return x.score - y.score; });
  return res;
}
function solveBank(O, P, C, W, H, maxRails) {
  var raw = solveRaw(O, P, W, H, maxRails), res = [];
  for (var i = 0; i < raw.length; i++) {
    var c = raw[i], pts = c.pts;
    var dObj = pts.length >= 2 ? norm(sub(pts[1], pts[0])) : norm(sub(P, O));
    var ghost = sub(O, mul(dObj, 2 * BALL_R));
    var dCue = norm(sub(ghost, C));
    var cut = ang(dCue, dObj);
    if (cut >= 85) continue;
    res.push({
      rails: c.rails, pts: pts, len: +c.len.toFixed(4),
      cut: +cut.toFixed(2), aim: +aimDeg(dCue).toFixed(2),
      ghost: [+ghost[0].toFixed(4), +ghost[1].toFixed(4)],
      score: +(c.rails.length * 100 + c.len * 10 + cut * 2).toFixed(2)
    });
  }
  res.sort(function (x, y) { return x.score - y.score; });
  return res;
}
function selfTest() {
  var W = 2.24, H = 1.12;
  var ks = solveKick([0.90, 0.25], [1.60, 0.95], [2.24, 1.12], W, H, 3);
  var bs = solveBank([0.60, 0.40], [0.05, 0.05], [1.80, 0.90], W, H, 3);
  if (!ks.length) throw new Error('kick returned no solutions');
  if (!bs.length) throw new Error('bank returned no solutions');
  var tp = build([1.5, 0.4], [1.08, 0.7467], ['B', 'L'], W, H);
  if (!tp || !verify(tp[0], ['B', 'L'], W, H)) throw new Error('2-rail verification failed');
  return 'self-test OK: kick=' + ks.length + ' sols, bank=' + bs.length + ' sols, verification pass';
}
//=== CORE END ===
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { solveKick: solveKick, solveBank: solveBank, selfTest: selfTest, build: build, verify: verify };
}
'use strict';
var W = 2.24, H = 1.12;                 // table units (9-ft, meters)
var state = {
  mode: 'kick',
  maxRails: 3,
  C: [0.90, 0.25],                      // cue
  O: [1.60, 0.95],                      // object
  P: [2.24 * 0.75, 1.12],               // pocket (default: near corner T-side)
  sols: [],
  sel: 0,
  drag: null
};
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var scale = 1, ox = 6, oy = 6, cssW = 0, cssH = 0, dpr = 1;
var PAD = 10;                            // px padding around cloth inside canvas

function sx(x) { return ox + x * scale; }
function sy(y) { return oy + (H - y) * scale; }   // y up on table -> y down on screen
function ux(px) { return (px - ox) / scale; }
function uy(py) { return H - (py - oy) / scale; }

function resize() {
  cssW = cv.parentElement.clientWidth;
  scale = (cssW - 2 * PAD) / W;
  cssH = Math.round(H * scale + 2 * PAD);
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ox = PAD; oy = PAD;
  draw();
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function pocketPts() {
  return [[0, 0], [W, 0], [0, H], [W, H], [0, H / 2], [W, H / 2]];
}

function drawBall(x, y, fill, ring, label) {
  var px = sx(x), py = sy(y), r = Math.max(7, scale * 0.0286 * 1.6);
  ctx.beginPath(); ctx.arc(px, py, r, 0, 7);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = ring; ctx.stroke();
  if (label) {
    ctx.fillStyle = '#0d1117';
    ctx.font = 'bold 9px ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, px, py + 0.5);
  }
}

function draw() {
  // frame
  ctx.fillStyle = '#2b1a0e';
  rr(0, 0, cssW, cssH, 12); ctx.fill();
  // cushions
  ctx.fillStyle = '#0f4d2a';
  rr(2, 2, cssW - 4, cssH - 4, 10); ctx.fill();
  // cloth
  ctx.fillStyle = '#14663a';
  ctx.fillRect(ox, oy, W * scale, H * scale);

  // rail labels
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('L', sx(0), sy(H / 2) - 0);
  ctx.fillText('R', sx(W), sy(H / 2));
  ctx.fillText('B', sx(W / 2), sy(0));
  ctx.fillText('T', sx(W / 2), sy(H));

  // pockets
  var pp = pocketPts();
  for (var i = 0; i < pp.length; i++) {
    var isTarget = Math.abs(pp[i][0] - state.P[0]) < 1e-9 && Math.abs(pp[i][1] - state.P[1]) < 1e-9;
    ctx.beginPath();
    ctx.arc(sx(pp[i][0]), sy(pp[i][1]), Math.max(6, scale * 0.07), 0, 7);
    ctx.fillStyle = '#0b0b0b'; ctx.fill();
    if (isTarget) { ctx.lineWidth = 2; ctx.strokeStyle = '#3fb950'; ctx.stroke(); }
  }

  // selected solution path
  var s = state.sols[state.sel];
  if (s) {
    // ghost ball on object (contact point)
    if (s.ghost) drawBall(s.ghost[0], s.ghost[1], 'rgba(255,255,255,.15)', 'rgba(255,255,255,.55)');
    ctx.beginPath();
    ctx.moveTo(sx(s.pts[0][0]), sy(s.pts[0][1]));
    for (var j = 1; j < s.pts.length; j++) ctx.lineTo(sx(s.pts[j][0]), sy(s.pts[j][1]));
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5; ctx.stroke();
    // bounce markers
    for (var k = 1; k <= s.rails.length; k++) {
      ctx.beginPath();
      ctx.arc(sx(s.pts[k][0]), sy(s.pts[k][1]), 3.5, 0, 7);
      ctx.fillStyle = '#ffd166'; ctx.fill();
    }
  }

  drawBall(state.P[0], state.P[1], '#3fb950', '#0d1117', 'P');
  drawBall(state.O[0], state.O[1], '#ffb02e', '#0d1117', 'O');
  drawBall(state.C[0], state.C[1], '#f2f2f2', '#0d1117', 'C');
}
// ------------------------------------------------ solve + list
function resolve() {
  if (state.mode === 'kick') {
    state.sols = solveKick(state.C, state.O, state.P, W, H, state.maxRails);
  } else {
    state.sols = solveBank(state.O, state.P, state.C, W, H, state.maxRails);
  }
  state.sel = 0;
  renderList();
  draw();
}

function renderList() {
  var list = document.getElementById('list'), st = document.getElementById('status');
  list.innerHTML = '';
  if (!state.sols.length) {
    st.textContent = 'no valid path (mode ' + state.mode + ', rails ≤ ' + state.maxRails + ')';
    list.innerHTML = '<div class="empty">— no solution —</div>';
    return;
  }
  st.textContent = state.mode.toUpperCase() + ' · ' + state.sols.length +
    ' solusi · sorted by score (lower = easier)';
  state.sols.forEach(function (s, i) {
    var btn = document.createElement('button');
    btn.className = 'sol' + (i === state.sel ? ' sel' : '');
    var tag = s.rails.length ? s.rails.join(' → ') : 'direct';
    btn.innerHTML =
      '<span class="tag">' + tag + '</span>' +
      '<span class="metrics">aim <b>' + s.aim.toFixed(1) + '°</b> · cut <b>' +
      s.cut.toFixed(1) + '°</b> · len <b>' + s.len.toFixed(3) + '</b> · score <b>' +
      s.score.toFixed(1) + '</b></span>' +
      '<span class="rank">#' + (i + 1) + '</span>';
    btn.onclick = function () { state.sel = i; renderList(); draw(); };
    list.appendChild(btn);
  });
}

// ------------------------------------------------ touch / drag
function pick(px, py) {
  var keys = ['C', 'O', 'P'], best = null, bestD = 1e9;
  for (var i = 0; i < keys.length; i++) {
    var p = state[keys[i]];
    var d = Math.hypot(sx(p[0]) - px, sy(p[1]) - py);
    if (d < bestD) { bestD = d; best = keys[i]; }
  }
  return bestD <= 26 ? best : null;
}

function clampPt(x, y) {
  return [Math.min(W, Math.max(0, x)), Math.min(H, Math.max(0, y))];
}

function ptFromEvent(e) {
  var r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

cv.addEventListener('pointerdown', function (e) {
  var p = ptFromEvent(e);
  var k = pick(p[0], p[1]);
  if (k) {
    state.drag = k;
    cv.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
});
cv.addEventListener('pointermove', function (e) {
  if (!state.drag) return;
  var p = ptFromEvent(e);
  state[state.drag] = clampPt(ux(p[0]), uy(p[1]));
  draw();
  e.preventDefault();
});
function endDrag(e) {
  if (!state.drag) return;
  state.drag = null;
  resolve();
  if (e) e.preventDefault();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ------------------------------------------------ controls
function setMode(m) {
  state.mode = m;
  document.getElementById('mKick').className = m === 'kick' ? 'on' : '';
  document.getElementById('mBank').className = m === 'bank' ? 'on' : '';
  resolve();
}
document.getElementById('mKick').onclick = function () { setMode('kick'); };
document.getElementById('mBank').onclick = function () { setMode('bank'); };

function setRails(n) {
  state.maxRails = Math.min(5, Math.max(1, n));
  document.getElementById('rLabel').textContent = 'rails ≤ ' + state.maxRails;
  resolve();
}
document.getElementById('rMinus').onclick = function () { setRails(state.maxRails - 1); };
document.getElementById('rPlus').onclick = function () { setRails(state.maxRails + 1); };

document.getElementById('btnReset').onclick = function () {
  state.C = [0.90, 0.25]; state.O = [1.60, 0.95]; state.P = [W * 0.75, H];
  setMode('kick'); setRails(3);
};

// ------------------------------------------------ init
(function init() {
  try {
    document.getElementById('stbadge').textContent = selfTest();
  } catch (err) {
    var b = document.getElementById('stbadge');
    b.textContent = 'SELF-TEST FAIL: ' + err.message;
    b.style.color = '#f85149'; b.style.borderColor = '#f8514966'; b.style.background = '#f8514933';
  }
  window.addEventListener('resize', resize);
  resize();
  resolve();
})();

</script>
</body>
</html>
